server:
  port: 8082

spring:
  application:
    name: session-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cadence}?currentSchema=public
    username: ${DB_USER:cadence}
    password: ${DB_PASSWORD:cadence_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: SessionServiceHikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # RabbitMQ connection — consumed by Spring Boot AMQP autoconfigure (RabbitProperties).
  # Phase 3 Stage 1 (D-impl-1, 2026-08-21). Credentials default to infrastructure/docker-compose.yml values.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:cadence}
    password: ${RABBITMQ_PASSWORD:cadence_dev_pw}

supabase:
  url: ${SUPABASE_URL:https://kvubxhrfipcvlephrxam.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    bucket-name: ${STORAGE_BUCKET_NAME:assessment-recordings}
    signed-url-expiry-seconds: ${SIGNED_URL_EXPIRY_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health

# Application-specific queue name constants (NOT the spring.rabbitmq.* autoconfigure namespace).
# Values MUST match ml-audio/amqp_consumer.py QUEUE_* constants exactly — see D-impl-1 sign-off.
# Both services declare queues idempotently: durable=true, auto_delete=false, exclusive=false.
rabbitmq:
  queues:
    analysis-requested: analysis.requested
    analysis-audio-completed: analysis.audio.completed
