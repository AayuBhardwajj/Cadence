server:
  port: 8082

spring:
  application:
    name: session-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # RabbitMQ connection — consumed by Spring Boot AMQP autoconfigure (RabbitProperties).
  # Phase 3 Stage 1 (D-impl-1, 2026-08-21). Credentials come from env/<CADENCE_ENV>.env (D26).
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

supabase:
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  storage:
    bucket-name: ${STORAGE_BUCKET_NAME:assessment-recordings}
    signed-url-expiry-seconds: ${SIGNED_URL_EXPIRY_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health

cadence:
  ml-audio:
    url: ${ML_AUDIO_URL:http://localhost:9001}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}

# Application-specific queue name constants (NOT the spring.rabbitmq.* autoconfigure namespace).
# Values MUST match ml-audio/amqp_consumer.py QUEUE_* constants exactly — see D-impl-1 sign-off.
# Both services declare queues idempotently: durable=true, auto_delete=false, exclusive=false.
rabbitmq:
  queues:
    analysis-requested: analysis.requested
    analysis-audio-completed: analysis.audio.completed
