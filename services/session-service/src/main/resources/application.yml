server:
  port: 8082

spring:
  application:
    name: session-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cadence}?currentSchema=public
    username: ${DB_USER:cadence}
    password: ${DB_PASSWORD:cadence_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: SessionServiceHikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

supabase:
  url: ${SUPABASE_URL:https://kvubxhrfipcvlephrxam.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    bucket-name: ${STORAGE_BUCKET_NAME:assessment-recordings}
    signed-url-expiry-seconds: ${SIGNED_URL_EXPIRY_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health
