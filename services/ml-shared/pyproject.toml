[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-shared"
version = "0.1.0"
description = "Shared ML utilities (LLM client, Supabase client, AI usage logger) for Cadence ML services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.4.0",
    "google-genai>=0.1.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
