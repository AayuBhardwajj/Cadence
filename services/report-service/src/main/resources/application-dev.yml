# report-service dev profile — loaded when SPRING_PROFILES_ACTIVE=dev
# Values come from env/dev.env via with-env.sh. No defaults (D26).
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:54322/postgres
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: ReportServiceHikariCP-dev
