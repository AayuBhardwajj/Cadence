server:
  port: 8083

spring:
  application:
    name: report-service
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health

cadence:
  security:
    jwt:
      issuer: ${SUPABASE_JWT_ISSUER:http://127.0.0.1:54321/auth/v1}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
      algorithm: ${SUPABASE_JWT_ALGORITHM:HS256}
      secret: ${SUPABASE_JWT_SECRET:}
      public-key-pem: ${SUPABASE_JWT_PUBLIC_KEY_PEM:}
    internal:
      enabled: true
      secret: ${CADENCE_INTERNAL_SERVICE_KEY}
