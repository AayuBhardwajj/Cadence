spring:
  application:
    name: report-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false

cadence:
  security:
    jwt:
      issuer: "https://auth.test.cadence.ai/auth/v1"
      audience: "authenticated"
      algorithm: "HS256"
      secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    internal:
      enabled: true
      secret: "internal-secret-for-tests-must-be-at-least-32-bytes-long"
