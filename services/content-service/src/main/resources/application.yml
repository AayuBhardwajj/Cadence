spring:
  application:
    name: content-service
  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres
    username: postgres.kvubxhrfipcvlephrxam
    password: ${DB_PASSWORD:cadence_dev}
