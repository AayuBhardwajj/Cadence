server:
  port: 8084

spring:
  application:
    name: content-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health

cadence:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  llm:
    groq-api-key: ${GROQ_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
  refill:
    interval-seconds: ${REFILL_INTERVAL_SECONDS:600}
