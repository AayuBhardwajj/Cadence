# auth-service dev profile — loaded when SPRING_PROFILES_ACTIVE=dev (set by with-env.sh)
# All values come from env/dev.env sourced by with-env.sh. No defaults allowed (D26).
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:54322/postgres?currentSchema=auth,public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      pool-name: AuthServiceHikariCP-dev
