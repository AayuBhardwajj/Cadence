server:
  port: 8085

spring:
  application:
    name: practice-game-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health

cadence:
  ml-audio:
    url: ${ML_AUDIO_URL:http://localhost:9001}
    timeout-seconds: ${ML_AUDIO_TIMEOUT_SECONDS:60}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
